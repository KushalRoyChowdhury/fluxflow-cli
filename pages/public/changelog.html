<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png">
    <title>Flux Flow | Changelog</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --text: #e0e0e0;
            --cyan: #00ffff;
            --magenta: #ff00ff;
            --yellow: #ffff00;
            --green: #4dff88;
            --red: #ff4d4d;
            --gray: #888888;
            --card-bg: #1a1a1a;
            --border: #333333;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            cursor: default;
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.8;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3em;
            margin: 0;
            background: linear-gradient(90deg, var(--cyan), #0077ff, var(--magenta));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--gray);
            font-size: 1.2em;
            margin-top: 10px;
        }

        /* Responsive Grid: row x col, up to 3 cols */
        .changelog-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
        }

        @media (max-width: 992px) {
            .changelog-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .changelog-grid {
                grid-template-columns: 1fr;
            }
        }

        .version-card {
            background: rgba(26, 26, 26, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .version-card:hover {
            /* transform: translateY(-4px); */
            border-color: var(--cyan);
            background: rgba(32, 32, 32, 0.35);
            box-shadow: 0 8px 30px rgba(0, 255, 255, 0.15);
        }

        /* Source card grows into the modal + fades, so the card itself feels like it opens */
        .version-card.card-morphing {
            transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1),
                        opacity 0.45s ease 0.05s;
            transform-origin: center center;
            pointer-events: none;
            z-index: 5;
        }

        /* Reverse: card returns as the modal collapses back into it (synced, snappier) */
        .version-card.card-morphing.card-morph-back {
            transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.2s ease;
        }

        .version-card-top {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .version-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .version-card-number {
            font-size: 1.5em;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .version-date {
            color: var(--gray);
            font-size: 0.85em;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Small viby caption after the date (only when a '.' is present) */
        .version-caption {
            display: inline-block;
            margin-top: 2px;
            font-size: 0.92em;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
            opacity: 0.6;
        }

        .card-stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .stat-pill {
            font-size: 0.75em;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .stat-improvements {
            background: rgba(77, 255, 136, 0.1);
            color: var(--green);
            border: 1px solid rgba(77, 255, 136, 0.25);
        }

        .stat-patches {
            background: rgba(255, 255, 0, 0.1);
            color: var(--yellow);
            border: 1px solid rgba(255, 255, 0, 0.25);
        }

        .stat-fixes {
            background: rgba(255, 77, 77, 0.1);
            color: var(--red);
            border: 1px solid rgba(255, 77, 77, 0.25);
        }

        .card-footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            color: var(--gray);
        }

        .view-details-link {
            color: var(--cyan);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: gap 0.2s ease, color 0.2s ease;
        }

        .version-card:hover .view-details-link {
            color: var(--magenta);
            gap: 8px;
        }

        .badge {
            font-size: 0.45em;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(0, 255, 255, 0.1);
            color: var(--cyan);
            border: 1px solid rgba(0, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            vertical-align: middle;
        }

        .badge-stable {
            background: rgba(77, 255, 136, 0.1);
            color: var(--green);
            border: 1px solid rgba(77, 255, 136, 0.3);
        }

        /* Modal / Popup Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: none;
            visibility: hidden;
            transition: background 0.38s ease, backdrop-filter 0.38s ease, visibility 0s linear 0.4s;
        }

        .modal-overlay.active {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: auto;
            visibility: visible;
            transition: background 0.38s ease, backdrop-filter 0.38s ease, visibility 0s linear 0s;
        }

        .modal-card {
            background: rgba(18, 18, 18, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            width: 100%;
            max-width: 760px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
            opacity: 0;
            /* morph transition — grow from the icon's center like iOS */
            transform-origin: center center;
            will-change: transform, opacity, border-radius;
        }

        .modal-card.morph-enter {
            transition: none;
        }

        .modal-card.morph-active {
            transition:
                transform 0.6s cubic-bezier(0.32, 0.72, 0, 1),
                opacity 0.28s ease,
                border-radius 0.6s cubic-bezier(0.32, 0.72, 0, 1),
                box-shadow 0.6s ease;
        }

        .modal-card.morph-exit {
            /* stays opaque while it shrinks back into the card, then fades at the very end */
            transition:
                transform 0.26s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.12s ease 0.14s,
                border-radius 0.26s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.24s ease;
        }

        /* App content emerges from inside the icon */
        .modal-card.morph-enter .modal-header,
        .modal-card.morph-enter .modal-body {
            opacity: 0;
            transform: scale(0.85);
        }

        .modal-card.morph-active .modal-header,
        .modal-card.morph-active .modal-body {
            transition:
                opacity 0.45s ease 0.12s,
                transform 0.65s cubic-bezier(0.32, 0.72, 0, 1) 0.06s;
        }

        .modal-card.morph-exit .modal-header,
        .modal-card.morph-exit .modal-body {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.1s ease, transform 0.16s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(26, 26, 26, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .modal-version {
            font-size: 1.8em;
            font-weight: bold;
            color: #ffffff;
        }

        /* Date sits beside the version, deliberately quieter */
        .modal-date {
            font-size: 0.95em;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--gray);
            align-self: flex-end;
            margin-left: -4px;
            padding-bottom: 4px;
        }

        .modal-close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 1.3em;
            line-height: 1;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-close-btn:hover {
            background: rgba(255, 77, 77, 0.25);
            border-color: var(--red);
            color: var(--red);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 28px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-body::-webkit-scrollbar {
            width: 8px;
        }

        .modal-body::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .modal-body::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 255, 0.4);
        }

        .section-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-top: 25px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .added-title {
            color: var(--green);
        }

        .changed-title {
            color: var(--yellow);
        }

        .fixes-title {
            color: var(--red);
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0 0 15px 0;
        }

        .version-note {
            background: rgba(0, 255, 255, 0.05);
            border-left: 3px solid var(--cyan);
            padding: 15px 18px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 24px;
            font-size: 0.95em;
            color: #d4d4d4;
            line-height: 1.5;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .version-note::before {
            content: '📝';
            font-style: normal;
            font-size: 1.1em;
        }

        li {
            margin-bottom: 10px;
            padding-left: 24px;
            position: relative;
            color: #cccccc;
        }

        li::before {
            content: '❯';
            position: absolute;
            left: 0;
            color: var(--gray);
            font-size: 0.9em;
            top: 2px;
        }

        code {
            background: #2d2d2d;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: var(--cyan);
            font-size: 1.05em;
        }

        a {
            color: var(--cyan);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--magenta);
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <canvas id="bg-canvas"></canvas>
    <div class="container">
        <header>
            <h1>Flux Flow CLI</h1>
            <div class="subtitle">Changelog & Release Notes</div>
        </header>
        <div id="changelog-container" class="changelog-grid"></div>
    </div>

    <!-- Popup / Modal -->
    <div id="changelog-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title-group" id="modal-title-group">
                    <!-- Populated dynamically -->
                </div>
                <button type="button" class="modal-close-btn" id="modal-close-btn" aria-label="Close details">✕</button>
            </div>
            <div class="modal-body" id="modal-body-content">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <script type="module">
        // Thanks to Gemini CLI. (つ╥﹏╥)つ JUNE 18.
        // Logging Off...
        // ...hopefully no bugs now... phew..
        import { stableVersions, changelogData } from './changelogData.js';
        // Store original URL to restore before refresh
        const ORIGINAL_URL = window.location.href;
        const MASK_PATH = "changelog.html";

        document.addEventListener('DOMContentLoaded', () => {
             renderChangelog();
             setupModalEvents();
        });

        function parseMarkdown(text) {
            if (!text) return '';
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
                .replaceAll('\n', '<br>');
        }

        // Split "MONTH DATE. caption" on the FIRST dot only → { date, caption }
        function splitNote(text) {
            if (!text) return { date: '', caption: '' };
            const dot = text.indexOf('.');
            if (dot === -1) return { date: text.trim(), caption: '' };
            return { date: text.slice(0, dot).trim(), caption: text.slice(dot + 1).trim() };
        }

        // Card note: "MONTH DATE" or "MONTH DATE. caption". Split on the FIRST dot only.
        function formatCardNote(text) {
            if (!text) return '';
            const dot = text.indexOf('.');
            if (dot === -1) return parseMarkdown(text);
            const date = text.slice(0, dot).trim();
            const caption = text.slice(dot + 1).trim();
            if (!caption) return parseMarkdown(date);
            return `${parseMarkdown(date)}<br><span class="version-caption">${parseMarkdown(caption)}</span>`;
        }

        function setupModalEvents() {
            const modal = document.getElementById('changelog-modal');
            const closeBtn = document.getElementById('modal-close-btn');

            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    closeModal();
                }
            });
        }

        let _lastSourceCard = null;

        let _lastSourceRect = null;

        function openModal(version, sourceCardEl) {
            const data = changelogData[version];
            if (!data) return;

            const modal = document.getElementById('changelog-modal');
            const modalCardEl = modal.querySelector('.modal-card');
            const titleGroup = document.getElementById('modal-title-group');
            const modalBody = document.getElementById('modal-body-content');

            _lastSourceCard = sourceCardEl || null;
            _lastSourceRect = null;

            // --- Populate content ---
            const versions = getSortedVersions();
            const isLatest = versions[0] === version;
            const isStable = stableVersions.includes(version);
            const note = splitNote(data.note);

            titleGroup.innerHTML = `
                <div class="modal-version">v${version}</div>
                ${note.date ? `<span class="modal-date">${parseMarkdown(note.date)}</span>` : ''}
                ${isLatest ? '<span class="badge">Latest</span>' : ''}
                ${isStable ? '<span class="badge badge-stable">Stable</span>' : ''}
            `;

            let bodyHtml = '';
            // Note body only carries the caption now — the date lives in the header.
            if (note.caption) bodyHtml += `<div class="version-note"><div>${parseMarkdown(note.caption)}</div></div>`;
            if (data.added && data.added.length > 0) {
                bodyHtml += `<div class="section-title added-title">✨ Improvements (${data.added.length})</div>
                    <ul>${data.added.map(item => `<li>${parseMarkdown(item)}</li>`).join('')}</ul>`;
            }
            if (data.changed && data.changed.length > 0) {
                bodyHtml += `<div class="section-title changed-title">🔄 Patches (${data.changed.length})</div>
                    <ul>${data.changed.map(item => `<li>${parseMarkdown(item)}</li>`).join('')}</ul>`;
            }
            if (data.fixes && data.fixes.length > 0) {
                bodyHtml += `<div class="section-title fixes-title">🐛 Fixes (${data.fixes.length})</div>
                    <ul>${data.fixes.map(item => `<li>${parseMarkdown(item)}</li>`).join('')}</ul>`;
            }
            if (!data.note && (!data.added || !data.added.length) && (!data.changed || !data.changed.length) && (!data.fixes || !data.fixes.length)) {
                bodyHtml = `<p style="color: var(--gray); text-align: center; padding: 20px 0;">No additional release details recorded for this version.</p>`;
            }
            modalBody.innerHTML = bodyHtml;

            // --- FLIP morph animation ---
            // 1. Reset modal card to natural flow size (no transform) to measure its final rect
            modalCardEl.classList.remove('morph-enter', 'morph-active', 'morph-exit');
            modalCardEl.style.transform = '';
            modalCardEl.style.opacity = '';
            modalCardEl.style.borderRadius = '';

            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';

            // 2. Measure final (destination) rect of modal card
            const finalRect = modalCardEl.getBoundingClientRect();

            // 3. Measure source card rect (BEFORE any morph transform is applied)
            const sourceRect = sourceCardEl
                ? sourceCardEl.getBoundingClientRect()
                : { left: finalRect.left, top: finalRect.top, width: finalRect.width, height: finalRect.height };
            _lastSourceRect = sourceCardEl ? sourceRect : null;

            // 4. Per-axis scale from the card's centre, so the modal's edges land EXACTLY
            //    on the card's edges. Uniform scale left top/bottom gaps that "blur out".
            const startScaleX = sourceRect.width / finalRect.width;
            const startScaleY = sourceRect.height / finalRect.height;
            const translateX = (sourceRect.left + sourceRect.width / 2) - (finalRect.left + finalRect.width / 2);
            const translateY = (sourceRect.top + sourceRect.height / 2) - (finalRect.top + finalRect.height / 2);

            // 4b. Grow the source card itself toward the modal and fade it out —
            //     this is what makes it feel like the card *is* opening the modal.
            if (sourceCardEl) {
                const cardScaleX = finalRect.width / sourceRect.width;
                const cardScaleY = finalRect.height / sourceRect.height;
                const cardTx = (finalRect.left + finalRect.width / 2) - (sourceRect.left + sourceRect.width / 2);
                const cardTy = (finalRect.top + finalRect.height / 2) - (sourceRect.top + sourceRect.height / 2);
                sourceCardEl.classList.add('card-morphing');
                sourceCardEl.getBoundingClientRect(); // reflow so the transition actually fires
                sourceCardEl.style.transform = `translate(${cardTx}px, ${cardTy}px) scale(${cardScaleX}, ${cardScaleY})`;
                sourceCardEl.style.opacity = '0';
            }

            // 5. Apply "First" state (card position/size/radius — looks exactly like the icon)
            modalCardEl.classList.add('morph-enter');
            modalCardEl.style.transform = `translate(${translateX}px, ${translateY}px) scale(${startScaleX}, ${startScaleY})`;
            modalCardEl.style.opacity = '0.6';
            modalCardEl.style.borderRadius = '14px';

            // 6. Force reflow then animate to final state
            modalCardEl.getBoundingClientRect();
            modalCardEl.classList.remove('morph-enter');
            modalCardEl.classList.add('morph-active');
            modalCardEl.style.transform = '';
            modalCardEl.style.opacity = '1';
            modalCardEl.style.borderRadius = '';
        }

        function closeModal() {
            const modal = document.getElementById('changelog-modal');
            const modalCardEl = modal.querySelector('.modal-card');

            // Get current modal rect
            const currentRect = modalCardEl.getBoundingClientRect();

            // Use the ORIGINAL (untransformed) card rect captured at open time —
            // getBoundingClientRect() here would return the scaled-up morph rect.
            let targetRect = currentRect;
            if (_lastSourceRect) {
                targetRect = _lastSourceRect;
            }

            // Calculate exit transform back toward the source card (per-axis, so edges land exactly)
            const endScaleX = targetRect.width / currentRect.width;
            const endScaleY = targetRect.height / currentRect.height;
            const translateX = (targetRect.left + targetRect.width / 2) - (currentRect.left + currentRect.width / 2);
            const translateY = (targetRect.top + targetRect.height / 2) - (currentRect.top + currentRect.height / 2);

            modalCardEl.classList.remove('morph-active');
            modalCardEl.classList.add('morph-exit');
            modalCardEl.style.transform = `translate(${translateX}px, ${translateY}px) scale(${endScaleX}, ${endScaleY})`;
            modalCardEl.style.opacity = '0';
            modalCardEl.style.borderRadius = '14px';

            // Send the source card back so it reappears as the modal collapses into it
            if (_lastSourceCard) {
                _lastSourceCard.classList.add('card-morph-back');
                _lastSourceCard.style.transform = '';
                _lastSourceCard.style.opacity = '';
            }

            // Fade out overlay simultaneously
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';

            // Clean up after transition.
            // NOTE: transitionend fires once PER property (transform, opacity, box-shadow...).
            // Only run on the transform (the longest/primary one) or the card snaps back mid-close.
            const onEnd = (e) => {
                if (e && e.target !== modalCardEl) return;
                if (e && e.propertyName !== 'transform') return;
                modalCardEl.removeEventListener('transitionend', onEnd);
                clearTimeout(fallbackTimer);
                modalCardEl.classList.remove('morph-exit');
                modalCardEl.style.transform = '';
                modalCardEl.style.opacity = '0';
                modalCardEl.style.borderRadius = '';
                if (_lastSourceCard) {
                    _lastSourceCard.classList.remove('card-morphing', 'card-morph-back');
                    _lastSourceCard.style.transform = '';
                    _lastSourceCard.style.opacity = '';
                }
                _lastSourceCard = null;
            };
            modalCardEl.addEventListener('transitionend', onEnd);
            // Safety net in case transformend is missed entirely
            const fallbackTimer = setTimeout(onEnd, 450);
        }

        function getSortedVersions() {
            return Object.keys(changelogData).sort((a, b) => {
                const partsA = a.split('.').map(Number);
                const partsB = b.split('.').map(Number);
                for (let i = 0; i < Math.max(partsA.length, partsB.length); i++) {
                    const numA = partsA[i] || 0;
                    const numB = partsB[i] || 0;
                    if (numA > numB) return -1;
                    if (numA < numB) return 1;
                }
                return 0;
            });
        }

        function renderChangelog() {
            const container = document.getElementById('changelog-container');
            const versions = getSortedVersions();

            let html = '';

            versions.forEach((version, index) => {
                const data = changelogData[version];
                const isLatest = index === 0;
                const isStable = stableVersions.includes(version);

                const addedCount = data.added ? data.added.length : 0;
                const changedCount = data.changed ? data.changed.length : 0;
                const fixesCount = data.fixes ? data.fixes.length : 0;

                html += `
                    <div class="version-card" data-version="${version}" tabindex="0" role="button" aria-label="Version ${version} details">
                        <div class="version-card-top">
                            <div class="version-card-header">
                                <div class="version-card-number">
                                    v${version}
                                    ${isLatest ? '<span class="badge">Latest</span>' : ''}
                                    ${isStable ? '<span class="badge badge-stable">Stable</span>' : ''}
                                </div>
                            </div>
                            ${data.note ? `<div class="version-date">${formatCardNote(data.note)}</div>` : ''}
                            <div class="card-stats">
                                ${addedCount > 0 ? `<span class="stat-pill stat-improvements">✨ ${addedCount}</span>` : ''}
                                ${changedCount > 0 ? `<span class="stat-pill stat-patches">🔄 ${changedCount}</span>` : ''}
                                ${fixesCount > 0 ? `<span class="stat-pill stat-fixes">🐛 ${fixesCount}</span>` : ''}
                                ${addedCount === 0 && changedCount === 0 && fixesCount === 0 ? `<span class="stat-pill" style="color:var(--gray); background:rgba(255,255,255,0.05);">Maintenance</span>` : ''}
                            </div>
                        </div>
                        <div class="card-footer">
                            <span>Release Notes</span>
                            <span class="view-details-link">View details ➔</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            container.querySelectorAll('.version-card').forEach(card => {
                const ver = card.getAttribute('data-version');
                card.addEventListener('click', () => openModal(ver, card));
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openModal(ver, card);
                    }
                });
            });
        }

        // ==========================================
        // BACKGROUND ANIMATION ENGINE
        // ==========================================
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let fluxConstellation = {
            x: 0, y: 0, vx: 0.18, vy: 0.12,
            nodes: [
                { dx: -30, dy: -20 }, // 0: L Ear base
                { dx: 30, dy: -20 },  // 1: R Ear base
                { dx: -45, dy: -50 }, // 2: L Ear tip
                { dx: 45, dy: -50 },  // 3: R Ear tip
                { dx: -50, dy: 10 },  // 4: L Cheek
                { dx: 50, dy: 10 },   // 5: R Cheek
                { dx: 0, dy: 45 },    // 6: Chin
                { dx: -20, dy: 0 },   // 7: L Eye
                { dx: 20, dy: 0 },    // 8: R Eye
                { dx: 0, dy: 15 },    // 9: Nose
                { dx: -70, dy: 5 },   // 10: L Whisker 1
                { dx: -70, dy: 15 },  // 11: L Whisker 2
                { dx: 70, dy: 5 },    // 12: R Whisker 1
                { dx: 70, dy: 15 },   // 13: R Whisker 2
                { dx: -10, dy: 30 },  // 14: L Mouth
                { dx: 10, dy: 30 },   // 15: R Mouth
            ],
            edges: [
                [0, 2], [2, 4], [4, 6], [6, 5], [5, 3], [3, 1], [1, 0], // Outline
                [4, 10], [4, 11], // L Whiskers
                [5, 12], [5, 13], // R Whiskers
                [9, 14], [9, 15], // Mouth
                [7, 9], [8, 9]    // Connect eyes to nose for structure
            ]
        };

        let geminiTextGroup = {
            x: 0, y: 0, vx: 0.05, vy: 0.03,
            nodes: [],
            edges: []
        };

        // Drawn by Gemini CLI
        const createGeminiText = () => {
            const spacing = 14;
            const pts = [];
            const edges = [];
            let nodeOffset = 0;

            const addLetter = (char, ox) => {
                // Define precise drawing paths (lines) for each letter
                const lmap = {
                    'G': { n: [[1,0],[0,0],[0,2],[1,2],[1,1],[0.6,1]], e: [[0,1],[1,2],[2,3],[3,4],[4,5]] },
                    'E': { n: [[1,0],[0,0],[0,1],[0.8,1],[0,2],[1,2]], e: [[0,1],[1,4],[4,5],[2,3]] },
                    'M': { n: [[0,2],[0,0],[0.5,1],[1,0],[1,2]], e: [[0,1],[1,2],[2,3],[3,4]] },
                    'I': { n: [[0.5,0],[0.5,2]], e: [[0,1]] },
                    'N': { n: [[0,2],[0,0],[1,2],[1,0]], e: [[0,1],[1,2],[2,3]] },
                    'C': { n: [[1,0],[0,0],[0,2],[1,2]], e: [[0,1],[1,2],[2,3]] },
                    'L': { n: [[0,0],[0,2],[1,2]], e: [[0,1],[1,2]] }
                };

                if (!lmap[char]) return;

                const letterNodes = lmap[char].n;
                const letterEdges = lmap[char].e;

                letterNodes.forEach(p => {
                    pts.push({ dx: ox + p[0]*9, dy: p[1]*12 }); // Reduced from 13x18
                });

                letterEdges.forEach(e => {
                    edges.push([nodeOffset + e[0], nodeOffset + e[1]]);
                });

                nodeOffset += letterNodes.length;
            };

            let cursor = -70; // Adjusted from -100 to account for smaller overall width
            "GEMINI".split('').forEach(c => { addLetter(c, cursor); cursor += spacing; });
            cursor += 5; // Reduced word gap from 10
            "CLI".split('').forEach(c => { addLetter(c, cursor); cursor += spacing; });
            return { pts, edges };
        };
        const textData = createGeminiText();
        geminiTextGroup.nodes = textData.pts;
        geminiTextGroup.edges = textData.edges;

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];

            // Randomly position the Easter eggs
            fluxConstellation.x = Math.random() * canvas.width;
            fluxConstellation.y = Math.random() * canvas.height;
            geminiTextGroup.x = Math.random() * canvas.width;
            geminiTextGroup.y = Math.random() * canvas.height;

            for (let i = 0; i < 120; i++) { // Increased by 200% (40 -> 120)
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedX: (Math.random() - 0.5) * 0.5,
                    speedY: (Math.random() - 0.5) * 0.5,
                    color: Math.random() > 0.5 ? '#00ffff' : '#ff00ff'
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update & Draw Easter Egg Constellation (Cat)
            fluxConstellation.x += fluxConstellation.vx;
            fluxConstellation.y += fluxConstellation.vy;
            if (fluxConstellation.x < 0 || fluxConstellation.x > canvas.width) fluxConstellation.vx *= -1;
            if (fluxConstellation.y < 0 || fluxConstellation.y > canvas.height) fluxConstellation.vy *= -1;

            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 1;
            fluxConstellation.edges.forEach(edge => {
                const n1 = fluxConstellation.nodes[edge[0]];
                const n2 = fluxConstellation.nodes[edge[1]];
                ctx.beginPath();
                ctx.globalAlpha = 0.3;
                ctx.moveTo(fluxConstellation.x + n1.dx, fluxConstellation.y + n1.dy);
                ctx.lineTo(fluxConstellation.x + n2.dx, fluxConstellation.y + n2.dy);
                ctx.stroke();
            });
            fluxConstellation.nodes.forEach(node => {
                ctx.beginPath();
                ctx.globalAlpha = 0.6;
                ctx.fillStyle = '#00ffff';
                ctx.arc(fluxConstellation.x + node.dx, fluxConstellation.y + node.dy, 2.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Update & Draw Gemini CLI Text (Subtle & Interactive)
            geminiTextGroup.x += geminiTextGroup.vx;
            geminiTextGroup.y += geminiTextGroup.vy;
            if (geminiTextGroup.x < 0 || geminiTextGroup.x > canvas.width) geminiTextGroup.vx *= -1;
            if (geminiTextGroup.y < 0 || geminiTextGroup.y > canvas.height) geminiTextGroup.vy *= -1;

            // Draw explicit lines for text to guarantee readability
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            geminiTextGroup.edges.forEach(edge => {
                const n1 = geminiTextGroup.nodes[edge[0]];
                const n2 = geminiTextGroup.nodes[edge[1]];
                ctx.beginPath();
                ctx.globalAlpha = 0.5; // Visible but faint
                ctx.moveTo(geminiTextGroup.x + n1.dx, geminiTextGroup.y + n1.dy);
                ctx.lineTo(geminiTextGroup.x + n2.dx, geminiTextGroup.y + n2.dy);
                ctx.stroke();
            });

            const textPts = geminiTextGroup.nodes.map(n => ({
                x: geminiTextGroup.x + n.dx,
                y: geminiTextGroup.y + n.dy,
                color: '#ffffff',
                size: 1.5,
                isText: true
            }));

            const allActiveParticles = [...particles, ...textPts];

            ctx.globalAlpha = 1.0;
            allActiveParticles.forEach((p, i) => {
                if (!p.isText) {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.isText ? 0.7 : 0.6;
                ctx.fill();

                // Distance-based webbing (only for non-text -> non-text, or text -> non-text)
                for (let j = i + 1; j < allActiveParticles.length; j++) {
                    const p2 = allActiveParticles[j];

                    // NEVER draw distance-based lines between two text nodes (prevents blobs)
                    if (p.isText && p2.isText) continue;

                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = p.color;
                        ctx.globalAlpha = (1 - (dist / 120)) * 0.3;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        animate();
    </script>
</body>
